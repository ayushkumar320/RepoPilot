name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retrieval-eval-artifact-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require fresh RAG after artifact for retrieval changes
        shell: bash
        run: |
          set -euo pipefail

          changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")"
          retrieval_changed="$(printf '%s\n' "$changed_files" | grep -E '^(packages/agents/src/repopilot_agents/(tools|qa|rerank)/|packages/ingestion/)' || true)"

          if [[ -z "$retrieval_changed" ]]; then
            echo "No retrieval-path changes detected."
            exit 0
          fi

          after_changed="$(printf '%s\n' "$changed_files" | grep -E '^evals/results/rag_phase[0-9]+/_after\.json$' || true)"

          if [[ -n "$after_changed" ]]; then
            echo "Retrieval changes include a fresh RAG _after.json artifact:"
            printf '%s\n' "$after_changed"
            exit 0
          fi

          echo "::error title=Missing RAG eval artifact::Retrieval-path changes must include evals/results/rag_phaseN/_after.json from a fresh bench run."
          echo "Changed retrieval files:"
          printf '%s\n' "$retrieval_changed"
          exit 1

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install workspace
        run: uv sync --all-packages --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Typecheck (mypy --strict)
        run: uv run mypy packages apps

      - name: Tests + coverage (≥80%)
        run: uv run pytest -m "not slow and not integration" --cov-fail-under=80

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The eval runner has been split into two dedicated workflows:
  #   - .github/workflows/eval-pr.yml    (PR-time, sampled, ≤5 min)
  #   - .github/workflows/eval-main.yml  (post-merge, full matrix, ≤30 min)
  # This file (ci.yml) covers lint/typecheck/test/coverage/gitleaks only.
