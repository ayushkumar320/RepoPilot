name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install workspace
        run: uv sync --all-packages --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Typecheck (mypy --strict)
        run: uv run mypy packages apps

      - name: Tests + coverage (≥80%)
        run: uv run pytest -m "not slow and not integration" --cov-fail-under=80

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The eval runner has been split into two dedicated workflows per docs/06 S6:
  #   - .github/workflows/eval-pr.yml    (PR-time, sampled, ≤5 min)
  #   - .github/workflows/eval-main.yml  (post-merge, full matrix, ≤30 min)
  # This file (ci.yml) covers lint/typecheck/test/coverage/gitleaks only.
