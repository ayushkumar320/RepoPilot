name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, stated explicitly. `pull-requests: read` is required by
# gitleaks-action, which lists a PR's commits to decide what to scan; without
# it the default contents-only token 403s with "Resource not accessible by
# integration" on every pull request.
permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install workspace
        run: uv sync --all-packages --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Typecheck (mypy --strict)
        run: uv run mypy packages apps

      - name: Tests + coverage (≥80%)
        run: uv run pytest -m "not slow and not integration" --cov-fail-under=80

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Typecheck web
        run: npm run typecheck

      # Pure-logic tests: the session store, identity signing, motion tokens.
      # Cheap and dependency-free, so they run before the build to fail fast.
      - name: Store tests (node --test)
        run: npm run test:store

      - name: Build web
        run: npm run build

      # Only chromium: playwright.config.ts declares no `projects`, so the
      # suite runs on the default chromium device and the other engines would
      # be download time spent on nothing.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Playwright starts its own `next dev` on port 3100 with the OAuth ids
      # cleared (see playwright.config.ts); CI needs no server of its own and
      # no .env.local — every spec mocks the API at the network layer.
      - name: E2E (Playwright)
        run: npm run test:e2e

      # `trace: "retain-on-failure"` is already set, but a trace left inside a
      # torn-down runner is unreadable. Without this, a red e2e job on CI shows
      # only the assertion text.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The eval workflows (eval-pr, eval-main) and the retrieval artifact gate were
  # removed on 2026-08-08: the RAG phases they guarded are finished, and the gate
  # failed every feature PR that so much as touched a file under those paths.
  # The bench still runs locally via the Makefile targets.
