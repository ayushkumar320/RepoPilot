name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, stated explicitly. `pull-requests: read` is required by
# gitleaks-action, which lists a PR's commits to decide what to scan; without
# it the default contents-only token 403s with "Resource not accessible by
# integration" on every pull request.
permissions:
  contents: read
  pull-requests: read

jobs:
  retrieval-eval-artifact-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require fresh RAG after artifact for retrieval changes
        shell: bash
        run: |
          set -euo pipefail

          changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")"
          retrieval_changed="$(printf '%s\n' "$changed_files" | grep -E '^(packages/agents/src/repopilot_agents/(tools|qa|rerank)/|packages/ingestion/)' || true)"

          if [[ -z "$retrieval_changed" ]]; then
            echo "No retrieval-path changes detected."
            exit 0
          fi

          # A migration alone cannot change retrieval quality, and product-layer
          # migrations (product_tours, usage_events, ...) touch nothing the
          # retrieval path reads. Exempt them only when they are the *only*
          # retrieval-path change in the PR: a migration that does affect
          # retrieval — a new index, a chunks column — lands with ingestion or
          # agents code beside it, and that combination still trips the gate.
          non_migration_changed="$(printf '%s\n' "$retrieval_changed" | grep -vE '^packages/ingestion/src/repopilot_ingestion/migrations/versions/[^/]+\.py$' || true)"

          if [[ -z "$non_migration_changed" ]]; then
            echo "Only migration files changed on the retrieval path; no bench artifact required:"
            printf '%s\n' "$retrieval_changed"
            exit 0
          fi

          after_changed="$(printf '%s\n' "$changed_files" | grep -E '^evals/results/rag_phase[0-9]+/_after\.json$' || true)"

          if [[ -n "$after_changed" ]]; then
            echo "Retrieval changes include a fresh RAG _after.json artifact:"
            printf '%s\n' "$after_changed"
            exit 0
          fi

          # Escape hatch for changes on these paths that provably cannot move
          # ranking -- concurrency (moving a sync call to a thread), warmup,
          # logging, type annotations. A bench run there only reproves the
          # status quo. It is a label rather than a commit-message token on
          # purpose: labelling is a deliberate act by someone with write
          # access, is visible on the PR, and shows up in its timeline.
          if printf '%s\n' '${{ toJSON(github.event.pull_request.labels.*.name) }}' | grep -q '"retrieval-eval-exempt"'; then
            echo "PR is labelled retrieval-eval-exempt; skipping the artifact requirement for:"
            printf '%s\n' "$non_migration_changed"
            exit 0
          fi

          echo "::error title=Missing RAG eval artifact::Retrieval-path changes must include evals/results/rag_phaseN/_after.json from a fresh bench run."
          echo "Changed retrieval files (migration-only changes are exempt):"
          printf '%s\n' "$non_migration_changed"
          echo "If the change cannot affect ranking, label the PR retrieval-eval-exempt."
          exit 1

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install workspace
        run: uv sync --all-packages --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Typecheck (mypy --strict)
        run: uv run mypy packages apps

      - name: Tests + coverage (≥80%)
        run: uv run pytest -m "not slow and not integration" --cov-fail-under=80

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Typecheck web
        run: npm run typecheck

      # Pure-logic tests: the session store, identity signing, motion tokens.
      # Cheap and dependency-free, so they run before the build to fail fast.
      - name: Store tests (node --test)
        run: npm run test:store

      - name: Build web
        run: npm run build

      # Only chromium: playwright.config.ts declares no `projects`, so the
      # suite runs on the default chromium device and the other engines would
      # be download time spent on nothing.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Playwright starts its own `next dev` on port 3100 with the OAuth ids
      # cleared (see playwright.config.ts); CI needs no server of its own and
      # no .env.local — every spec mocks the API at the network layer.
      - name: E2E (Playwright)
        run: npm run test:e2e

      # `trace: "retain-on-failure"` is already set, but a trace left inside a
      # torn-down runner is unreadable. Without this, a red e2e job on CI shows
      # only the assertion text.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The eval runner has been split into two dedicated workflows:
  #   - .github/workflows/eval-pr.yml    (PR-time, sampled, ≤5 min)
  #   - .github/workflows/eval-main.yml  (post-merge, full matrix, ≤30 min)
  # This file (ci.yml) covers lint/typecheck/test/coverage/gitleaks only.
