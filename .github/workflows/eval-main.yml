# Main-branch full eval matrix (docs/06 S6 — two-tier strategy).
#
# Runs the full Phase 2/3/5 eval matrix against fastapi, httpx, flask after
# every merge to main. Target wall-clock: ≤30 minutes. Results uploaded as
# a build artifact and (optionally) posted to a status badge endpoint.

name: eval-main (full matrix)

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/**"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/eval-main.yml"
  workflow_dispatch:

concurrency:
  group: eval-main
  cancel-in-progress: false  # don't cancel — let each post-merge eval finish

jobs:
  eval-full:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: repopilot
          POSTGRES_PASSWORD: repopilot
          POSTGRES_DB: repopilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repopilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://repopilot:repopilot@localhost:5432/repopilot
      REDIS_URL: redis://localhost:6379/0
      OLLAMA_URL: http://localhost:11434
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      EVAL_MODE: full

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install workspace
        run: uv sync --all-packages --all-groups

      - name: Run migrations
        run: cd packages/ingestion && uv run alembic upgrade head

      - name: Full matrix eval
        run: make test-eval-full

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.sha }}
          path: |
            eval-report.json
            eval-report.md
          if-no-files-found: warn
          retention-days: 30
