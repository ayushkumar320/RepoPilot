# PR-time sampled eval (docs/06 S6 — two-tier strategy).
#
# Runs a subset of the eval matrix on every PR. Target wall-clock: ≤5 minutes.
# The full Phase 2/3/5 matrix runs separately in eval-main.yml on push:main.
#
# Design:
# - Uses Postgres+pgvector as a service container. No daemon dependencies:
#   Verifier runs against Groq (with HF Inference Providers fallback), and
#   embeddings run in-process via sentence-transformers.
# - Skips cleanly if a required dataset file is missing (so this is green on a
#   fresh repo where Blockers 2/3 in docs/CURRENT_PHASE.md aren't done yet).
# - Skips on forks where secrets aren't available (LLM-bound tests detect missing
#   GROQ_API_KEY and skip).
# - Hard timeout 8 minutes (target 5; 8 is the panic budget).

name: eval-pr (sampled)

on:
  pull_request:
    paths:
      - "packages/**"
      - "apps/**"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/eval-pr.yml"

concurrency:
  group: eval-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-sampled:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: repopilot
          POSTGRES_PASSWORD: repopilot
          POSTGRES_DB: repopilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repopilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://repopilot:repopilot@localhost:5432/repopilot
      REDIS_URL: redis://localhost:6379/0
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      EVAL_MODE: sampled

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install workspace
        run: uv sync --all-packages --all-groups

      - name: Run migrations
        run: cd packages/ingestion && uv run alembic upgrade head

      - name: Sampled eval
        run: make test-eval-sampled

      - name: Post eval numbers to PR
        if: always()
        run: |
          echo "::notice title=Sampled eval complete::See job log for per-dataset numbers. Full matrix runs on main post-merge."
