repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=512]

  # Keep this rev in lockstep with the `ruff` pin in pyproject.toml's dev
  # group. CI runs `uv run ruff format --check`, so a hook on a different
  # minor version formats code that CI then rejects.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Runs through uv in the workspace environment, not in a pre-commit venv.
  # mirrors-mypy installs only what `additional_dependencies` lists — three
  # packages against a project that imports sqlalchemy, fastapi, httpx, arq,
  # networkx, git, tree_sitter, cryptography and sentence_transformers — so
  # every one of those was an unresolved import and the hook reported 72
  # phantom errors on every commit. A hook that can never pass is a hook
  # everyone learns to skip, which is how an unformatted file reached `main`.
  #
  # `pass_filenames: false` is deliberate: mypy needs the whole program, and
  # this is character-for-character the command CI runs.
  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict (via uv)
        entry: uv run mypy packages apps
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
