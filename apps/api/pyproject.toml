[project]
name = "repopilot-api"
version = "0.0.1"
description = "FastAPI app. Endpoints come online in Phase 4."
requires-python = ">=3.12,<3.14"
dependencies = [
    "repopilot-core",
    "repopilot-ingestion",
    "repopilot-agents",
    "fastapi>=0.115,<0.116",
    "starlette<0.42",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "arq>=0.26,<0.27",
    "structlog>=24.4,<25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot_api"]
