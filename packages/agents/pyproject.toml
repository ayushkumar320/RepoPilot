[project]
name = "repopilot-agents"
version = "0.0.1"
description = "LangGraph nodes + capability library (Phase 2+)."
requires-python = ">=3.12,<3.14"
dependencies = ["repopilot-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot_agents"]
