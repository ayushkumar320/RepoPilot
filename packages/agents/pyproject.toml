[project]
name = "repopilot-agents"
version = "0.0.1"
description = "LangGraph nodes + capability library (Phase 2+)."
requires-python = ">=3.12,<3.14"
dependencies = [
    "repopilot-core",
    "repopilot-ingestion",
    "langgraph>=0.2.50,<0.3",
    "networkx>=3.3,<4",
    "sqlalchemy[asyncio]>=2.0.34,<3",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3.6,<0.4",
    "pydantic>=2.9,<3",
    "structlog>=24.4,<25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot_agents"]
