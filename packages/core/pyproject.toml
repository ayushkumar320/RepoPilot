[project]
name = "repopilot-core"
version = "0.0.1"
description = "Shared core: settings, logging, and the single LLMProvider all agents go through."
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "httpx>=0.27",
    "tenacity>=9.0",
    # Embeddings run in-process via sentence-transformers (HF model weights).
    # No Ollama, no daemon. First call downloads weights into the HF hub cache.
    "sentence-transformers>=3.0",
    "huggingface-hub>=0.24",
    # Embedding model nomic-ai/nomic-embed-text-v1.5 ships with remote code
    # that we trust on first load; einops is its hard dep for matrix ops.
    "einops>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot_core"]
