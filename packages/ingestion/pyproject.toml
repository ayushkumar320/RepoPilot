[project]
name = "repopilot-ingestion"
version = "0.0.1"
description = "Phase 1 — clone → parse → chunk → graph → embed → persist (built next phase)."
requires-python = ">=3.12,<3.14"
dependencies = [
    "repopilot-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot_ingestion"]
