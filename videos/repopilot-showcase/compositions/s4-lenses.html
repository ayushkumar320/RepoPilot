<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "JetBrains Mono", monospace;
        }
        .fill {
          position: absolute;
          inset: 0;
          background: #0d1117;
        }
        /* Background light: one soft neutral source lifting the frame off flat black.
           Deliberately NOT accent-tinted — accent means "verified source" and stays
           rationed. Static, so it costs nothing in determinism. */
        .glow {
          position: absolute;
          inset: 0;
          background: radial-gradient(
            82% 64% at 50% 36%,
            rgba(150, 168, 194, 0.1) 0%,
            rgba(150, 168, 194, 0.035) 46%,
            rgba(150, 168, 194, 0) 74%
          );
        }
        .kicker {
          position: absolute;
          left: 120px;
          top: 88px;
          display: block;
          font-size: 38px;
          line-height: 1.2;
          color: #818b98;
        }
        .stage {
          position: absolute;
          left: 120px;
          top: 340px;
          width: 480px;
          height: 280px;
        }
        .edges {
          position: absolute;
          left: 0;
          top: 0;
          width: 480px;
          height: 280px;
          overflow: visible;
        }
        .edge {
          stroke: #2b3440;
          stroke-width: 1.5;
          fill: none;
        }
        .node {
          position: absolute;
          display: block;
          width: 14px;
          height: 14px;
          margin-left: -7px;
          margin-top: -7px;
          border-radius: 50%;
          background: #697583;
        }
        .node-hub {
          width: 20px;
          height: 20px;
          margin-left: -10px;
          margin-top: -10px;
        }
        .grid {
          position: absolute;
          left: 680px;
          top: 150px;
          width: 1120px;
          display: grid;
          grid-template-columns: 540px 540px;
          grid-auto-rows: 206px;
          gap: 20px 40px;
        }
        .pcard {
          position: relative;
          display: block;
          width: 540px;
          height: 206px;
          border-radius: 18px;
          background: #1a212b;
          border: 1px solid #2b3440;
          overflow: hidden;
        }
        .pcard-glow {
          position: absolute;
          inset: 0;
          display: block;
          border-radius: 18px;
          background: #173b39;
          border: 2px solid #2b6c67;
          opacity: 0;
        }
        .pcard-body {
          position: absolute;
          inset: 0;
          display: block;
          padding: 28px 32px;
        }
        .pcard-label {
          display: block;
          font-size: 32px;
          line-height: 1.15;
          color: #edf1f5;
        }
        .pcard-blurb {
          display: block;
          margin-top: 14px;
          font-size: 27px;
          line-height: 1.34;
          color: #aab3bd;
        }
        .strip {
          position: absolute;
          left: 120px;
          top: 828px;
          width: 1680px;
          height: 172px;
          background: #151b23;
          border: 1px solid #2b3440;
          border-left: 6px solid #49b9ad;
          border-radius: 10px;
          overflow: hidden;
        }
        .strip-item {
          position: absolute;
          inset: 0;
          display: block;
          padding: 22px 34px;
          opacity: 0;
        }
        .strip-role {
          display: block;
          font-size: 28px;
          line-height: 1.2;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          color: #49b9ad;
        }
        .strip-text {
          display: block;
          margin-top: 14px;
          font-size: 40px;
          line-height: 1.3;
          color: #edf1f5;
        }
      </style>

      <div data-hf-id="hf-w0vf" id="root" data-composition-id="s4-lenses" data-width="1920" data-height="1080">
        <div data-hf-id="hf-4qej" class="fill"></div>
        <div data-hf-id="hf-2s7n" class="glow"></div>

        <div data-hf-id="hf-1er7" id="s4-kicker" class="kicker">Six lenses, or describe your own.</div>

        <div data-hf-id="hf-f3hs" id="s4-stage" class="stage">
          <svg data-hf-id="hf-yadc" id="s4-edges" class="edges" viewBox="0 0 480 280" xmlns="http://www.w3.org/2000/svg" />
        </div>

        <div data-hf-id="hf-4ys0" id="s4-grid" class="grid"></div>

        <div data-hf-id="hf-g8hs" id="s4-strip" class="strip" data-layout-allow-caption-zone="">
          <span data-hf-id="hf-i8t3" id="s4-find-0" class="strip-item">
            <span data-hf-id="hf-5kzz" class="strip-role">Security reviewer</span>
            <span data-hf-id="hf-lbi3" class="strip-text">Session identity is asserted by the web app; the API trusts the cookie.</span>
          </span>
          <span data-hf-id="hf-c33a" id="s4-find-1" class="strip-item">
            <span data-hf-id="hf-1hvc" class="strip-role">Maintainer</span>
            <span data-hf-id="hf-qi13" class="strip-text">Three capabilities are implemented but gated off — their eval gates missed.</span>
          </span>
          <span data-hf-id="hf-84z9" id="s4-find-2" class="strip-item">
            <span data-hf-id="hf-0sjn" class="strip-role">Learner</span>
            <span data-hf-id="hf-59wn" class="strip-text">Intent is captured before analysis; every downstream agent reads it.</span>
          </span>
        </div>
      </div>

      <script>
        (function () {
          const PERSONAS = [
            ["Open-source contributor", "Where to make a first change, and what protects it."],
            ["Competitive analyst", "Capabilities, limits, and where the seams are."],
            ["Security reviewer", "Trust boundaries, inputs, secrets, and authz."],
            ["Adopter / integrator", "Public API, config, and cost of adoption."],
            ["Learner", "How the system is shaped and why."],
            ["Maintainer", "Fragility, debt, and what needs attention."],
          ];

          // Half-scale of scene 3's layout — same graph, read as the same object.
          const NODES = [
            [240, 20, 1], [125, 65, 0], [350, 65, 0], [240, 105, 1],
            [100, 148, 0], [200, 148, 0], [310, 148, 0], [415, 148, 0],
            [240, 192, 1], [65, 233, 0], [165, 238, 0], [265, 238, 0],
            [371, 233, 0], [30, 105, 0], [30, 60, 0], [75, 20, 0],
            [150, 20, 0], [450, 105, 0], [450, 60, 0], [450, 192, 0],
          ];
          const EDGES = [
            [0, 1], [0, 2], [0, 3], [1, 3], [2, 3], [3, 4], [3, 5], [3, 6], [3, 7],
            [4, 5], [5, 6], [5, 8], [6, 8], [7, 8], [8, 9], [8, 10], [8, 11], [8, 12],
            [13, 14], [14, 15], [15, 16], [13, 3], [17, 3], [18, 17], [19, 12], [6, 7],
          ];

          const stage = document.getElementById("s4-stage");
          const svg = document.getElementById("s4-edges");
          const SVG_NS = "http://www.w3.org/2000/svg";

          EDGES.forEach((pair) => {
            const a = NODES[pair[0]];
            const b = NODES[pair[1]];
            const line = document.createElementNS(SVG_NS, "line");
            line.setAttribute("x1", a[0]);
            line.setAttribute("y1", a[1]);
            line.setAttribute("x2", b[0]);
            line.setAttribute("y2", b[1]);
            line.setAttribute("class", "edge");
            svg.appendChild(line);
          });

          NODES.forEach((n, i) => {
            const dot = document.createElement("span");
            dot.className = n[2] ? "node node-hub" : "node";
            dot.id = "s4-node-" + i;
            dot.style.left = n[0] + "px";
            dot.style.top = n[1] + "px";
            stage.appendChild(dot);
          });

          const grid = document.getElementById("s4-grid");
          PERSONAS.forEach((p, i) => {
            const card = document.createElement("div");
            card.className = "pcard";
            card.id = "s4-card-" + i;
            const glow = document.createElement("span");
            glow.className = "pcard-glow";
            glow.id = "s4-glow-" + i;
            const body = document.createElement("span");
            body.className = "pcard-body";
            const label = document.createElement("span");
            label.className = "pcard-label";
            label.textContent = p[0];
            const blurb = document.createElement("span");
            blurb.className = "pcard-blurb";
            blurb.textContent = p[1];
            body.appendChild(label);
            body.appendChild(blurb);
            card.appendChild(glow);
            card.appendChild(body);
            grid.appendChild(card);
          });

          const sel = (indices) => indices.map((i) => "#s4-node-" + i).join(",");

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });

          tl.fromTo("#s4-kicker", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.2);
          tl.fromTo("#s4-stage", { opacity: 0, x: -26 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.45);
          tl.fromTo(
            ".pcard",
            { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: { each: 0.08 } },
            0.7,
          );
          tl.fromTo("#s4-strip", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 1.5);

          // Three lenses over the SAME graph. Each swap re-lights a visibly different subset;
          // every state is an explicit fromTo/to so a backward seek lands on the right frame.
          const BEATS = [
            { at: 1.75, card: 2, set: [0, 1, 2, 7, 17, 18] },
            { at: 4.65, card: 5, set: [8, 9, 10, 11, 12, 19] },
            { at: 7.55, card: 4, set: [3, 4, 5, 6, 13] },
          ];

          BEATS.forEach((beat, bi) => {
            const t = beat.at;

            if (bi > 0) {
              tl.to("#s4-glow-" + BEATS[bi - 1].card, { opacity: 0, duration: 0.24, ease: "power2.in" }, t - 0.14);
              tl.to("#s4-find-" + (bi - 1), { opacity: 0, duration: 0.18, ease: "none" }, t - 0.14);
            }

            tl.fromTo("#s4-glow-" + beat.card, { opacity: 0 }, { opacity: 1, duration: 0.28, ease: "power2.out" }, t);
            tl.to("#s4-card-" + beat.card, { scale: 1.03, duration: 0.18, ease: "power2.out" }, t);
            tl.to("#s4-card-" + beat.card, { scale: 1, duration: 0.3, ease: "power2.inOut" }, t + 0.18);

            // Dim everything, then light this lens's subset — never overlapping windows on
            // the same property, or GSAP's overwrite order decides the frame instead of us.
            tl.to(".node", { opacity: 0.2, backgroundColor: "#697583", duration: 0.22, ease: "power2.out" }, t);
            tl.to(sel(beat.set), { opacity: 1, backgroundColor: "#49b9ad", duration: 0.28, ease: "power2.out" }, t + 0.24);

            tl.fromTo("#s4-find-" + bi, { opacity: 0 }, { opacity: 1, duration: 0.24, ease: "none" }, t + 0.1);
          });

          window.__timelines["s4-lenses"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
